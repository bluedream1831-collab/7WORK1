<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外倉效期管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        input[type="date"], input[type="number"] { font-size: 16px !important; }
        body { padding-bottom: 110px; }
        .list-enter-active, .list-leave-active { transition: all 0.3s ease; }
        .list-enter-from, .list-leave-to { opacity: 0; transform: translateY(10px); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="app" v-cloak>
        
        <!-- 1. 登入畫面 -->
        <div v-if="!isAuthorized" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 px-6">
            <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl">
                <h2 class="text-xl font-bold text-slate-800 text-center mb-6 tracking-widest">系統安全驗證</h2>
                <input type="password" v-model="passwordInput" @keyup.enter="verifyPassword" 
                       placeholder="請輸入管理代碼"
                       class="w-full border-2 border-slate-100 rounded-2xl px-4 py-4 outline-none focus:border-indigo-500 text-center text-xl mb-4 transition-all tracking-widest">
                <button @click="verifyPassword" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all">登入系統</button>
                <p v-if="loginError" class="text-red-500 text-center text-xs mt-4 font-bold">代碼錯誤</p>
            </div>
        </div>

        <!-- 2. 主程式畫面 -->
        <div v-else class="max-w-md mx-auto">
            
            <!-- 頂部標題列 -->
            <div class="sticky top-0 z-30 bg-slate-900 text-white px-4 py-3 shadow-lg flex justify-between items-center border-b border-indigo-500/30">
                <div class="flex flex-col">
                    <h1 class="text-base font-bold tracking-tight">外倉效期管理</h1>
                    <span class="text-[9px] text-slate-400 font-mono tracking-wider italic">Expiry Tracking System</span>
                </div>
                <div class="flex items-center gap-2 text-[10px]">
                    <button @click="showHelp = !showHelp" class="bg-slate-800 border border-slate-700 px-2 py-1.5 rounded-lg flex items-center gap-1">💡 說明</button>
                    <button @click="clearAllRecords" class="bg-red-900/40 border border-red-800 text-red-200 px-2 py-1.5 rounded-lg flex items-center gap-1">🗑️ 清空</button>
                </div>
            </div>

            <!-- 操作手冊 -->
            <div v-if="showHelp" class="bg-indigo-50 p-4 text-[11px] text-indigo-900 border-b border-indigo-100 leading-relaxed shadow-inner">
                <p class="font-bold mb-1 italic">📖 快速指引：</p>
                1. 點擊商品按鈕新增紀錄（支援同品項多效期）。<br>
                2. 填寫數量與效期（<span class="text-red-600 font-bold">系統禁止填寫過期日</span>）。<br>
                3. 背景警示：<span class="text-red-500 font-bold">紅(30天內)</span>、<span class="text-amber-600 font-bold">黃(90天內)</span>。<br>
                4. 點擊底部按鈕一鍵匯出訊息或 Excel。
            </div>

            <div class="p-4 space-y-4">
                <!-- 商品快速選擇按鈕 -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest text-center">點擊品項按鈕新增回報紀錄</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button v-for="p in productMaster" :key="p.id" @click="addRecord(p)" 
                                class="bg-white border border-slate-200 active:bg-indigo-600 active:text-white text-left p-3 rounded-xl shadow-sm transition-all flex flex-col">
                            <span class="text-[9px] font-mono text-indigo-500 leading-none mb-1 tracking-tighter font-bold">CODE: {{ p.id }}</span>
                            <span class="text-[11px] font-bold text-slate-700 leading-tight">{{ p.name }}</span>
                        </button>
                    </div>
                </div>

                <!-- 自定義品項 -->
                <div class="flex gap-2">
                    <input type="text" v-model="customProductName" placeholder="新增其他品項..." class="flex-1 bg-slate-200 border-0 rounded-xl px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-indigo-300">
                    <button @click="addCustomProduct" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">新增</button>
                </div>

                <hr class="border-slate-200">

                <!-- 回報清單 (已移除總合計展示) -->
                <div class="space-y-3">
                    <transition-group name="list">
                        <div v-for="(item, index) in records" :key="item.key" 
                             class="p-4 rounded-2xl border-2 transition-all relative shadow-sm"
                             :class="getWarningStyle(item.expiry)">
                            
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex flex-col">
                                    <span class="text-[10px] font-mono text-slate-400 font-bold">NO.{{ item.id }}</span>
                                    <span class="font-black text-slate-800 text-sm leading-tight italic">{{ item.name }}</span>
                                </div>
                                <button @click="removeRecord(index)" class="text-red-400 text-[10px] font-bold border border-red-100 px-2 py-0.5 rounded-md shadow-sm bg-white/50">移除</button>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white/40 rounded-lg p-2 text-center">
                                    <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">數量 (箱)</label>
                                    <input type="number" inputmode="numeric" v-model.number="item.qty" placeholder="0" class="w-full bg-transparent border-b border-slate-300 py-1 outline-none text-xl font-mono text-center focus:border-indigo-400">
                                </div>
                                <div class="bg-white/40 rounded-lg p-2 text-center">
                                    <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">到期日期</label>
                                    <input type="date" v-model="item.expiry" @change="validateDate(item)" class="w-full bg-transparent border-b border-slate-300 py-1 outline-none text-sm text-center focus:border-indigo-400">
                                </div>
                            </div>
                        </div>
                    </transition-group>
                </div>

                <div v-if="records.length === 0" class="text-center py-12 text-slate-300 italic text-sm border-2 border-dashed border-slate-200 rounded-3xl">
                    等待資料錄入中...
                </div>

                <!-- 預覽區 -->
                <div class="bg-slate-900 rounded-2xl p-5 mt-4 border border-slate-800 shadow-2xl">
                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-3 text-center tracking-widest italic">LINE 回報格式預覽</p>
                    <div class="text-slate-400 text-[10px] font-mono whitespace-pre-wrap leading-tight">
                        {{ summaryContent || '尚無有效效期資料可彙整...' }}
                    </div>
                </div>
            </div>

            <!-- 底部固定操作列 -->
            <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur-md border-t border-slate-200 flex gap-2 z-40">
                <button @click="exportToExcel" class="bg-emerald-100 text-emerald-700 w-16 h-14 rounded-2xl flex items-center justify-center text-xl shadow-inner border border-emerald-200">📊</button>
                <button @click="copyToClipboard" :disabled="records.length === 0" 
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 disabled:bg-slate-300 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition-all">
                    一鍵複製彙整訊息
                </button>
            </div>

            <!-- 複製提示彈窗 -->
            <transition name="fade">
                <div v-if="copyStatus" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 bg-black/80 text-white px-8 py-4 rounded-3xl font-bold shadow-2xl text-center">
                    已成功彙整並複製
                </div>
            </transition>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    isAuthorized: false,
                    showHelp: false,
                    passwordInput: '',
                    loginError: false,
                    copyStatus: false,
                    customProductName: '',
                    // 17 項商品 (已精簡名稱)
                    productMaster: [
                        { id: '033471', name: '冰戀雙旋冰淇淋-巧克力香草' },
                        { id: '303905', name: '原味本舖-紅豆牛奶冰棒' },
                        { id: '305176', name: '冰戀雪捲冰淇淋-牛奶風味' },
                        { id: '343319', name: 'Ice Walker冰塊' },
                        { id: '350323', name: '刨走族芒果風味冰沙' },
                        { id: '380972', name: '瑞穗鮮乳巧酥雪糕' },
                        { id: '567084', name: '布丁牛奶雪糕' },
                        { id: '611852', name: '原味本舖-桂圓糯米冰棒' },
                        { id: '647930', name: '麥香奶茶雪糕' },
                        { id: '678061', name: '原味本舖-花生牛奶冰棒' },
                        { id: '678368', name: '瑞穗鮮乳雪糕' },
                        { id: '681796', name: '冰淇淋-香草風味' },
                        { id: '718654', name: '布丁牛奶雪糕(翻轉雪糕)' },
                        { id: '757304', name: '香草杯裝80g' },
                        { id: '765471', name: '原味本舖-冬瓜檸檬冰棒' },
                        { id: '855411', name: '刨走族烏梅風味冰沙' },
                        { id: '977064', name: '瑞穗鮮乳紅豆雪糕' }
                    ],
                    records: JSON.parse(localStorage.getItem('savedRecords_Warehouse_NoSum')) || []
                }
            },
            mounted() { this.checkAuth(); },
            watch: {
                records: { handler() { this.saveData(); }, deep: true }
            },
            computed: {
                summaryContent() {
                    const validRecords = this.records.filter(r => r.expiry);
                    if (validRecords.length === 0) return "";
                    const grouped = {};
                    validRecords.forEach(r => {
                        const key = `${r.id}_${r.name}`;
                        if (!grouped[key]) grouped[key] = { id: r.id, name: r.name, total: 0, details: [] };
                        const qty = r.qty || 0;
                        grouped[key].total += qty;
                        grouped[key].details.push({ qty, expiry: r.expiry });
                    });
                    const now = new Date();
                    let text = `📦 【外倉效期管理回報】\n日期：${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}\n━━━━━━━━━━━━━━━\n`;
                    for (const key in grouped) {
                        const item = grouped[key];
                        text += `■ [${item.id}] ${item.name}\n`;
                        text += `　 品項總數：${item.total} 箱\n`;
                        item.details.sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
                        item.details.forEach(d => { text += `　- ${d.qty} 箱 (效期: ${d.expiry})\n`; });
                        text += `\n`;
                    }
                    text += `━━━━━━━━━━━━━━━\n⚠️ 以上資料供幹部管理外倉需求`;
                    return text.trim();
                }
            },
            methods: {
                checkAuth() {
                    if (localStorage.getItem('authDate_Warehouse_NoSum') === new Date().toLocaleDateString()) this.isAuthorized = true;
                },
                verifyPassword() {
                    if (this.passwordInput === '888') {
                        localStorage.setItem('authDate_Warehouse_NoSum', new Date().toLocaleDateString());
                        this.isAuthorized = true;
                    } else {
                        this.loginError = true;
                        this.passwordInput = '';
                    }
                },
                validateDate(item) {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    if (item.expiry && new Date(item.expiry) < today) {
                        alert("⚠️ 不可選擇過期日期！");
                        item.expiry = '';
                    }
                },
                exportToExcel() {
                    let csv = "\uFEFF品號,品名,數量,效期\n";
                    this.records.forEach(r => { csv += `${r.id},${r.name},${r.qty || 0},${r.expiry || '未填'}\n`; });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `外倉效期回報_${new Date().toLocaleDateString()}.csv`;
                    link.click();
                },
                getWarningStyle(expiry) {
                    if (!expiry) return 'bg-white border-slate-100';
                    const diff = (new Date(expiry) - new Date()) / (1000 * 60 * 60 * 24);
                    if (diff <= 30) return 'bg-red-50 border-red-200';
                    if (diff <= 90) return 'bg-amber-50 border-amber-200';
                    return 'bg-green-50 border-green-200';
                },
                addRecord(product) {
                    this.records.push({ key: Date.now() + Math.random(), id: product.id, name: product.name, qty: null, expiry: '' });
                },
                addCustomProduct() {
                    if (this.customProductName.trim()) {
                        this.records.push({ key: Date.now() + Math.random(), id: 'NEW', name: this.customProductName.trim(), qty: null, expiry: '' });
                        this.customProductName = '';
                    }
                },
                removeRecord(index) { this.records.splice(index, 1); },
                saveData() { localStorage.setItem('savedRecords_Warehouse_NoSum', JSON.stringify(this.records)); },
                clearAllRecords() { if (confirm("確定要清空目前填寫的所有資料嗎？")) this.records = []; },
                async copyToClipboard() {
                    if (!this.summaryContent) return;
                    await navigator.clipboard.writeText(this.summaryContent);
                    this.copyStatus = true;
                    setTimeout(() => this.copyStatus = false, 1500);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
