<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外倉效期管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div id="app" class="max-w-2xl mx-auto pb-10">
        <!-- 標題區 -->
        <div class="bg-slate-700 text-white p-6 rounded-t-2xl shadow-lg border-b-4 border-blue-500 text-center">
            <h1 class="text-2xl font-bold tracking-wider text-blue-100">外倉效期管理回報</h1>
        </div>

        <div class="bg-white p-6 rounded-b-2xl shadow-xl space-y-6">
            
            <!-- 管理自定義品項 -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase italic">自定義品項擴充</label>
                <div class="flex gap-2">
                    <input type="text" v-model="newProductName" @keyup.enter="addProductType" placeholder="輸入其他品項名稱..." class="flex-1 border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-inner">
                    <button @click="addProductType" class="bg-slate-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-slate-700 transition-all text-sm">
                        新增
                    </button>
                </div>
            </div>

            <!-- 操作按鈕：快速新增紀錄 -->
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase italic">選擇品項新增紀錄 (可同品項多效期)</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    <button v-for="type in productTypes" :key="type" @click="addRecord(type)" 
                            class="bg-blue-50 border border-blue-200 hover:border-blue-600 text-blue-800 font-bold py-2 px-1 rounded-lg shadow-sm transition-all text-xs sm:text-sm active:scale-95">
                        + {{ type }}
                    </button>
                </div>
            </div>

            <hr class="border-gray-100">

            <!-- 回報紀錄清單 -->
            <div class="space-y-4">
                <transition-group name="fade">
                    <div v-for="(item, index) in records" :key="item.id" class="p-4 bg-white border-2 border-slate-50 rounded-xl relative shadow-sm border-l-4 border-l-blue-500">
                        <button @click="removeRecord(index)" class="absolute top-2 right-2 text-red-300 hover:text-red-500 text-xs font-bold">
                            移除
                        </button>
                        
                        <div class="flex items-center gap-2 mb-3">
                            <span class="font-black text-slate-700">{{ item.name }}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">七米寄庫數量 (箱)</label>
                                <input type="number" v-model.number="item.qty" placeholder="0" class="w-full border-b border-gray-200 py-1 focus:border-blue-500 outline-none text-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase text-blue-500">到期日期</label>
                                <input type="date" v-model="item.expiry" class="w-full border-b border-gray-200 py-1 focus:border-blue-500 outline-none text-sm">
                            </div>
                        </div>
                    </div>
                </transition-group>
            </div>

            <!-- 無資料提示 -->
            <div v-if="records.length === 0" class="text-center py-10 text-gray-400 italic text-sm border-2 border-dashed border-gray-100 rounded-xl">
                請點擊上方品項按鈕來建立回報清單
            </div>

            <!-- 功能按鈕區 -->
            <div class="pt-6 space-y-3">
                <button @click="copyToClipboard" :disabled="records.length === 0" 
                        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    一鍵複製回報訊息
                </button>
                
                <button @click="clearAllRecords" v-if="records.length > 0"
                        class="w-full bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 rounded-xl transition-all text-sm">
                    🗑️ 清除所有已填紀錄
                </button>

                <p v-if="copyStatus" class="text-center text-green-600 font-bold text-sm animate-pulse">✅ 訊息已複製，可直接至 Line 貼上</p>
            </div>

            <!-- 訊息預覽 -->
            <div class="bg-slate-800 rounded-xl p-5 mt-6 shadow-inner border border-slate-700">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-3 text-center">LINE 回報格式預覽</p>
                <div class="text-slate-300 text-xs font-mono whitespace-pre-wrap leading-relaxed">
                    {{ summaryContent || '尚未產生資料...' }}
                </div>
            </div>
        </div>
    </div>

    <style>
        .fade-enter-active, .fade-leave-active { transition: all 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(10px); }
    </style>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    newProductName: '',
                    copyStatus: false,
                    // 預設品項清單
                    productTypes: ['巧克力雪捲', '牛奶雪捲', '大冰', '藍冰', '綠冰', '紅冰'],
                    // 填寫紀錄
                    records: []
                }
            },
            computed: {
                summaryContent() {
                    const validRecords = this.records.filter(r => r.expiry);
                    if (validRecords.length === 0) return "";

                    const now = new Date();
                    const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
                    
                    let text = `📦 【七米寄庫效期回報】\n日期：${timeStr}\n━━━━━━━━━━━━━━━\n`;
                    
                    validRecords.forEach((r, idx) => {
                        text += `${idx + 1}. 品項：${r.name}\n`;
                        text += `　 七米數量：${r.qty || 0} 箱\n`;
                        text += `　 效期：${r.expiry}\n`;
                        text += `┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈\n`;
                    });
                    
                    text += `⚠️ 以上資料供幹部管理外倉需求`;
                    return text;
                }
            },
            methods: {
                addProductType() {
                    const name = this.newProductName.trim();
                    if (name && !this.productTypes.includes(name)) {
                        this.productTypes.push(name);
                        this.newProductName = '';
                    }
                },
                addRecord(name) {
                    this.records.push({
                        id: Date.now() + Math.random(),
                        name: name,
                        qty: null,
                        expiry: ''
                    });
                },
                removeRecord(index) {
                    this.records.splice(index, 1);
                },
                clearAllRecords() {
                    if (confirm("確定要清除目前所有填寫的內容嗎？")) {
                        this.records = [];
                    }
                },
                async copyToClipboard() {
                    if (!this.summaryContent) {
                        alert("請先填寫『到期日期』才能產生訊息！");
                        return;
                    }
                    try {
                        await navigator.clipboard.writeText(this.summaryContent);
                        this.copyStatus = true;
                        setTimeout(() => this.copyStatus = false, 2000);
                    } catch (err) {
                        alert("複製失敗，請手動複製下方預覽區文字");
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
